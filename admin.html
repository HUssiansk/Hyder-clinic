<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة الإدارة</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 24px;
      background: #f5f9f8;
      color: #123;
    }
    .box {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }
    input, button {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cfe3df;
      font-size: 15px;
      margin: 8px 0;
    }
    button {
      background: #1fb3a6;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #dfeae8;
      padding: 12px;
      text-align: right;
    }
    th {
      background: #eaf7f5;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>لوحة إدارة الحجوزات</h2>

    <div id="loginBox">
      <input id="pass" type="password" placeholder="كلمة المرور">
      <button onclick="login()">دخول</button>
    </div>

    <div id="dataBox" class="hidden">
      <button onclick="loadBookings()">تحديث</button>
      <table>
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>الوقت</th>
            <th>الاسم</th>
            <th>رقم الهاتف</th>
            <th>الخدمة</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const ADMIN_URL = "https://script.google.com/macros/s/AKfycbxE5N_zaX-fXJDimwnHHUI23TiMzDIIMLB5xAWs7kSH3hkchTnw-ehc0R5Lm_G-GeQO/exec";
    let AUTH_PASS = "";

    async function login() {
      const pass = document.getElementById("pass").value.trim();
      if (!pass) {
        alert("أدخل كلمة المرور");
        return;
      }
      AUTH_PASS = pass;
      await loadBookings();
    }

    async function loadBookings() {
      try {
        const url = `${ADMIN_URL}?mode=admin&pass=${encodeURIComponent(AUTH_PASS)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          alert(data.error || "فشل الدخول");
          return;
        }

        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";

        if (!data.data || data.data.length === 0) {
          tbody.innerHTML = "<tr><td colspan='5'>لا توجد حجوزات حالياً</td></tr>";
          document.getElementById("loginBox").classList.add("hidden");
          document.getElementById("dataBox").classList.remove("hidden");
          return;
        }

        data.data.forEach(item => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${item.day || ""}</td>
            <td>${item.slot || ""}</td>
            <td>${item.name || ""}</td>
            <td>${item.phone || ""}</td>
            <td>${item.service || ""}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dataBox").classList.remove("hidden");
      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء جلب الحجوزات");
      }
    }
  </script>
</body>
</html>
